[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-test-tools"
version = "0.1.0"
description = "An MCP server that lets an AI agent run tests, read results and file bugs, with safe defaults."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sujyonta Kumar Giri" }]
keywords = ["mcp", "model-context-protocol", "testing", "qa", "pytest", "agents", "test-automation"]
dependencies = [
    "mcp>=2.3,<3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
mcp-test-tools = "mcp_test_tools.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
